name: PET SALON BUSINESS V1.0.2 JAPANESE UI FIX

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pet-salon-business-v102-japanese-ui-fix.yml'

permissions:
  contents: write
  pages: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[BUSINESS-V1.0.2-JP-UI-FIXED]')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Japanese heading wrapping and invisible button text
        shell: python
        run: |
          from pathlib import Path

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")

          old_heading = '<h2>きれいにするだけではなく、<br>その子の「いつも」を整える。</h2>'
          new_heading = (
              '<h2 class="biz-jp-philosophy-title">'
              '<span class="biz-jp-line">きれいにするだけではなく、</span>'
              '<span class="biz-jp-line">その子の「いつも」を整える。</span>'
              '</h2>'
          )

          if old_heading in index:
              index = index.replace(old_heading, new_heading, 1)

          index_path.write_text(index, encoding="utf-8")

          css_path = Path("styles.css")
          css = css_path.read_text(encoding="utf-8")

          marker = "/* BUSINESS V1.0.2 JAPANESE UI FIX */"
          if marker not in css:
              css += r'''

          /* BUSINESS V1.0.2 JAPANESE UI FIX */
          .business-site .biz-section-head h2{
            text-wrap:balance;
            line-break:strict;
          }

          .business-site .biz-jp-philosophy-title{
            font-size:clamp(2.25rem,3.15vw,3.45rem)!important;
            line-height:1.36!important;
            letter-spacing:-.025em!important;
            text-wrap:initial!important;
          }

          .business-site .biz-jp-philosophy-title .biz-jp-line{
            display:block;
            white-space:nowrap;
          }

          .business-site .btn-secondary{
            color:#25352d;
          }

          .business-site .compare-final-cta .btn-secondary{
            background:#fff!important;
            border-color:#fff!important;
            color:#25352d!important;
          }

          .business-site .compare-final-cta .btn-primary{
            background:#25352d!important;
            border-color:rgba(255,255,255,.24)!important;
            color:#fff!important;
            box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
          }

          .business-site .compare-final-cta h2{
            text-wrap:balance;
            line-break:strict;
          }

          @media(max-width:980px){
            .business-site .biz-jp-philosophy-title{
              font-size:clamp(2.2rem,5.2vw,3rem)!important;
            }
            .business-site .biz-jp-philosophy-title .biz-jp-line{
              white-space:normal;
            }
          }

          @media(max-width:680px){
            .business-site .biz-jp-philosophy-title{
              font-size:2rem!important;
              line-height:1.42!important;
              letter-spacing:-.02em!important;
            }
            .business-site .biz-jp-philosophy-title .biz-jp-line{
              display:block;
              white-space:normal;
              word-break:normal;
              overflow-wrap:break-word;
            }
            .business-site .compare-final-cta h2{
              font-size:2rem!important;
              line-height:1.4!important;
            }
          }
          '''

          css_path.write_text(css, encoding="utf-8")

          for html_path in Path(".").glob("*.html"):
              text = html_path.read_text(encoding="utf-8")
              text = text.replace("styles.css?v=1011", "styles.css?v=1012")
              text = text.replace("styles.css?v=1010", "styles.css?v=1012")
              html_path.write_text(text, encoding="utf-8")

      - name: QA V1.0.2
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class="biz-jp-philosophy-title"' index.html
          grep -q 'きれいにするだけではなく、</span>' index.html
          grep -q 'その子の「いつも」を整える。</span>' index.html
          grep -q 'BUSINESS V1.0.2 JAPANESE UI FIX' styles.css
          grep -q 'compare-final-cta .btn-secondary' styles.css
          grep -q 'color:#25352d!important' styles.css
          grep -q 'white-space:nowrap' styles.css
          grep -q 'styles.css?v=1012' index.html
          grep -q 'styles.css?v=1012' compare.html
          echo "BUSINESS V1.0.2 JAPANESE UI QA PASS"

      - name: Commit V1.0.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css *.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: BUSINESS V1.0.2 Japanese wrapping and button contrast [BUSINESS-V1.0.2-JP-UI-FIXED]'
          git push

      - name: Request GitHub Pages rebuild
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          code=$(curl -sS -o /tmp/pages-build.json -w '%{http_code}'             -L -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          echo "Pages rebuild request HTTP ${code}"
          cat /tmp/pages-build.json || true
          exit 0
